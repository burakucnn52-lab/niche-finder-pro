<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NICHIFY PRO şifreni sıfırla. E-posta adresini gir ve şifre sıfırlama bağlantısı al.">
  
  <title>Şifremi Unuttum - NICHIFY PRO</title>
  
  <link rel="stylesheet" href="/css/core.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
</head>
<body>
  
  <!-- Aurora Background -->
  <div class="aurora-bg">
    <div class="aurora-3"></div>
  </div>
  
  <!-- Ana sayfaya dön -->
  <a href="/" class="auth-back">
    <span>←</span>
    <span>Ana Sayfaya Dön</span>
  </a>
  
  <!-- Auth Page -->
  <div class="auth-page">
    <div class="auth-container">
      
      <div class="auth-card">
        
        <a href="/" class="auth-logo">
          <span class="auth-logo-icon">🎯</span>
          <span class="auth-logo-text gradient-text-aurora">NICHIFY</span>
          <span class="badge badge-pro badge-sm">PRO</span>
        </a>
        
        <div class="auth-header">
          <div style="font-size: 3rem; margin-bottom: var(--space-md);">🔒</div>
          <h1>Şifremi Unuttum</h1>
          <p>E-posta adresini gir, sana <strong>şifre sıfırlama bağlantısı</strong> gönderelim.</p>
        </div>
        
        <!-- Alert -->
        <div id="alert" class="alert alert-danger auth-alert hidden">
          <span class="alert-icon">⚠️</span>
          <div class="alert-content">
            <div id="alert-message"></div>
          </div>
        </div>
        
        <div id="successAlert" class="alert alert-success auth-alert hidden">
          <span class="alert-icon">✅</span>
          <div class="alert-content">
            <div class="alert-title">Bağlantı gönderildi!</div>
            <div>E-posta kutunu kontrol et. Spam klasörünü de kontrol etmeyi unutma!</div>
          </div>
        </div>
        
        <!-- Form -->
        <form id="forgotForm" class="auth-form">
          
          <div class="form-group">
            <label class="form-label">E-posta Adresin</label>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="ornek@eposta.com"
              required
              autocomplete="email"
            >
            <span class="form-help">Kayıtlı e-posta adresini gir</span>
          </div>
          
          <button type="submit" class="btn btn-primary btn-lg btn-block auth-submit" id="submitBtn">
            <span class="btn-text">Sıfırlama Bağlantısı Gönder</span>
            <span class="spinner spinner-sm hidden" id="spinner"></span>
          </button>
          
        </form>
        
        <div class="auth-footer">
          Şifreni hatırladın mı? 
          <a href="/login">Giriş Yap</a>
        </div>
        
      </div>
      
    </div>
  </div>
  
  <script>
    // Şifremi Unuttum Formu - RESEND ile mail gönderir
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const btnText = submitBtn.querySelector('.btn-text');
      const spinner = document.getElementById('spinner');
      const alert = document.getElementById('alert');
      const alertMessage = document.getElementById('alert-message');
      const successAlert = document.getElementById('successAlert');
      
      // Yükleniyor durumu
      submitBtn.disabled = true;
      btnText.textContent = 'Gönderiliyor...';
      spinner.classList.remove('hidden');
      alert.classList.add('hidden');
      successAlert.classList.add('hidden');
      
      try {
        // Kendi backend endpoint'imize istek at (Resend ile mail gönderir)
        const response = await fetch('/api/send_password_reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Başarılı - mail gönderildi
          successAlert.classList.remove('hidden');
          document.getElementById('forgotForm').reset();
          btnText.textContent = 'Bağlantı Gönderildi';
          
          // 5 saniye sonra butonu sıfırla
          setTimeout(() => {
            submitBtn.disabled = false;
            btnText.textContent = 'Sıfırlama Bağlantısı Gönder';
            spinner.classList.add('hidden');
          }, 5000);
          
        } else {
          // Hata
          alertMessage.textContent = result.error || 'Bir hata oluştu. Lütfen tekrar dene.';
          alert.classList.remove('hidden');
          submitBtn.disabled = false;
          btnText.textContent = 'Sıfırlama Bağlantısı Gönder';
          spinner.classList.add('hidden');
        }
        
      } catch (error) {
        console.error('Şifre sıfırlama hatası:', error);
        alertMessage.textContent = 'Bağlantı hatası. İnternet bağlantını kontrol et.';
        alert.classList.remove('hidden');
        submitBtn.disabled = false;
        btnText.textContent = 'Sıfırlama Bağlantısı Gönder';
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
